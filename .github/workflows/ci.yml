name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch; a green result for an overwritten
# commit is not worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Ionic / Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: app/www
          retention-days: 7

  e2e:
    name: End-to-end (browser + sync server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The suite runs the real Go sync server, not a mock: the zero-knowledge
      # assertion reads what actually lands on its disk.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Install
        working-directory: app
        run: npm ci

      - name: Install Chrome
        working-directory: app
        run: npx playwright install --with-deps chrome

      - name: Run
        working-directory: app
        run: npm run e2e:ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

  adapters:
    name: Sync adapters against real remotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Install Chrome
        working-directory: app
        run: npx playwright install --with-deps chrome

      # Git goes through `git http-backend`, the CGI program every Git host
      # runs, and S3 through MinIO in Docker. Both are on the runner already.
      - name: Build
        working-directory: app
        run: npm run build

      - name: Git and S3 adapters
        working-directory: app
        run: npx playwright test --project=chrome e2e/git-sync.spec.ts e2e/s3-sync.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: adapter-report
          path: app/test-results
          retention-days: 7

  server:
    name: Sync server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      # -race catches the concurrency the immutability guarantee depends on.
      - run: go test -race -count=1 ./...

      - name: Cross-compile every released target
        run: make dist

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install and build the web bundle
        working-directory: app
        run: |
          npm ci
          npm run cap:sync

      - name: Assemble debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
