name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued one finish rather than
# cancelling it: a half-deployed service worker is worse than a slow deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/configure-pages@v5

      - name: Build
        working-directory: app
        env:
          # Pages serves the site from /<repo>/, so the app's base href and the
          # service worker scope have to match or nothing resolves.
          BASE_HREF: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build -- --base-href "$BASE_HREF"

      - name: Add SPA fallback
        working-directory: app
        # Pages has no rewrite rules, so a deep link like /tabs/accounts would
        # 404. Serving index.html as the 404 page hands the route to the router.
        run: cp www/index.html www/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
