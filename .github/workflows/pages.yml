name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued one finish rather than
# cancelling it: a half-deployed service worker is worse than a slow deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Reports where Pages will actually serve the site from. Requires Pages
      # to be enabled with "GitHub Actions" as the source, otherwise it fails
      # with "Get Pages site failed".
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        working-directory: app
        env:
          # Where Pages will actually serve this site from. A custom domain
          # serves from the root and reports "", a project site reports
          # "/easy-docket"; the base href and the service worker scope have to
          # match whichever it is or no asset resolves.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base_href="${PAGES_BASE_PATH:-/}"
          case "$base_href" in
            */) ;;
            *) base_href="$base_href/" ;;
          esac
          echo "Building with base href $base_href"
          npm ci
          npm run build -- --base-href "$base_href"

      - name: Add SPA fallback
        working-directory: app
        # Pages has no rewrite rules, so a deep link like /tabs/accounts would
        # 404. Serving index.html as the 404 page hands the route to the router.
        run: cp www/index.html www/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
