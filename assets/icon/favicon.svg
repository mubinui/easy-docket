<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Easy Docket">
  <!--
    The favicon, which is the same mark drawn for 16 and 32 pixels.
    A browser tab is the one place this appears at a size where the three
    entries of `icon.svg` close up into a grey smudge, so this variant fills
    more of the canvas — no maskable safe zone is needed here — and carries two
    thicker lines instead of three.
  -->
